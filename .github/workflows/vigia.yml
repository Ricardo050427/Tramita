name: Vigía del catálogo

# Cada mañana compara el catálogo oficial de Hermosillo con la copia de Tramita
# y publica en data/bitacora.json lo que cambió.
on:
  schedule:
    - cron: "0 13 * * *" # 6:00 en Hermosillo
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vigia
  cancel-in-progress: false

jobs:
  vigilar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/vigia.mjs
      - name: Publicar la bitácora
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bitacora.json data/vigia-base.json
          if git diff --cached --quiet; then
            echo "Sin cambios que publicar."
          else
            git commit -m "Vigía: revisión diaria del catálogo oficial"
            git push
          fi
